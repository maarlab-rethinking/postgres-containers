name: Update PostgreSQL versions

on:
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

permissions: read-all

jobs:
  build:
    name: Run update script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_GHA_PAT }}

      - name: Run update script
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            VERSIONS="$(
            curl -Ss -q https://www.postgresql.org/versions.json \
            | jq -r '[.[] | select(.supported == true) | .major + "." + .latestMinor]
            | sort
            | map("  \"" + . + "\"")
            | join(",\n")' \
            | sed '1i postgreSQLVersions = [' \
            | sed '$a ]'
            )"
            printf '%s\n' "$VERSIONS" \
            | sed -i '/^postgreSQLVersions = \[/,/^]/d;/^\/\/ PostgreSQL versions/r /dev/stdin' docker-bake.hcl

      - name: Diff
        run: |
          git status
          git diff

      - name: Temporarily disable "include administrators" branch protection
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        id: disable_include_admins
        env:
          GH_TOKEN: ${{ secrets.REPO_GHA_PAT }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/branches/main/protection/enforce_admins"
          if enabled="$(gh api "${endpoint}" --jq .enabled 2>/dev/null)"; then
            echo "initial_status=${enabled}" >> "${GITHUB_OUTPUT}"
            if [ "${enabled}" = "true" ]; then
              gh api -X DELETE "${endpoint}" --silent
              echo "enforce_admins disabled on main"
            else
              echo "enforce_admins was already off"
            fi
          else
            echo "initial_status=" >> "${GITHUB_OUTPUT}"
            echo "main is not protected; nothing to disable"
          fi

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        with:
          author_name: CloudNativePG Automated Updates
          author_email: noreply@cnpg.com
          message: 'chore: update PostgreSQL versions'

      - name: Enable "include administrators" branch protection
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_GHA_PAT }}
          INITIAL_STATUS: ${{ steps.disable_include_admins.outputs.initial_status }}
        run: |
          set -euo pipefail
          if [ "${INITIAL_STATUS}" = "true" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/branches/main/protection/enforce_admins" --silent
            echo "enforce_admins restored on main"
          else
            echo "enforce_admins was not enabled before; leaving it off"
          fi
