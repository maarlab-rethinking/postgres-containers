name: Update Catalogs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-catalogs]

permissions: read-all

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  update-catalogs:
    name: Updating catalogs
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      # TODO: remove this step once system images are EOL
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: postgres-containers
          token: ${{ secrets.REPO_GHA_PAT }}

      - name: Checkout artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: artifacts
          repository: maarlab-rethinking/artifacts
          token: ${{ secrets.REPO_GHA_PAT }}
          ref: main

      - name: Generate catalogs
        uses: ./postgres-containers/.github/actions/generate-catalogs
        with:
          output-dir: artifacts/image-catalogs/
          registry: ghcr.io/maarlab-rethinking/postgresql
          family: postgresql
          distributions: bookworm,trixie
          image-types: minimal,standard,system
          regex: '(\d+)(?:\.\d+|beta\d+|rc\d+|alpha\d+)-(\d{12})'

      # TODO: remove this step once system images are EOL
      - name: Update legacy catalogs
        run: |
          cp artifacts/image-catalogs/catalog-system-bookworm.yaml postgres-containers/Debian/ClusterImageCatalog-bookworm.yaml
          yq -i '.metadata.name = "postgresql"' postgres-containers/Debian/ClusterImageCatalog-bookworm.yaml

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign catalogs
        run: |
          for file in artifacts/image-catalogs/*.yaml; do
              echo "Signing $file..."
              cosign sign-blob "$file" --bundle "$file.sigstore.json" --yes
          done

          # TODO: remove this once system images are EOL
          for file in postgres-containers/Debian/*.yaml; do
              echo "Signing $file..."
              cosign sign-blob "$file" --bundle "$file.sigstore.json" --yes
          done

      - name: Diff
        working-directory: artifacts
        run: |
          git add -A .
          git status
          git diff --staged

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          cwd: 'artifacts'
          add: 'image-catalogs'
          author_name: CloudNativePG Automated Updates
          author_email: noreply@cnpg.com
          message: 'chore: update imageCatalogs'

      # TODO: remove this step once system images are EOL
      - name: Temporarily disable "include administrators" branch protection
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        id: disable_include_admins
        env:
          GH_TOKEN: ${{ secrets.REPO_GHA_PAT }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/branches/main/protection/enforce_admins"
          if enabled="$(gh api "${endpoint}" --jq .enabled 2>/dev/null)"; then
            echo "initial_status=${enabled}" >> "${GITHUB_OUTPUT}"
            if [ "${enabled}" = "true" ]; then
              gh api -X DELETE "${endpoint}" --silent
              echo "enforce_admins disabled on main"
            else
              echo "enforce_admins was already off"
            fi
          else
            echo "initial_status=" >> "${GITHUB_OUTPUT}"
            echo "main is not protected; nothing to disable"
          fi

      # TODO: remove this step once system images are EOL
      - name: Legacy diff
        working-directory: postgres-containers
        run: |
          git add -A .
          git status
          git diff --staged

      # TODO: remove this step once system images are EOL
      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          cwd: 'postgres-containers'
          add: 'Debian'
          author_name: CloudNativePG Automated Updates
          author_email: noreply@cnpg.com
          message: 'chore: update imageCatalogs'

      # TODO: remove this step once system images are EOL
      - name: Enable "include administrators" branch protection
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_GHA_PAT }}
          INITIAL_STATUS: ${{ steps.disable_include_admins.outputs.initial_status }}
        run: |
          set -euo pipefail
          if [ "${INITIAL_STATUS}" = "true" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/branches/main/protection/enforce_admins" --silent
            echo "enforce_admins restored on main"
          else
            echo "enforce_admins was not enabled before; leaving it off"
          fi
